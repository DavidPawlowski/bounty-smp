# ═══════════════════════════════════════════════════════════
#  Bounty SMP - Configuration
# ═══════════════════════════════════════════════════════════
# Recipe values use Bukkit Material enum names.
# Full list: https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Material.html
#
# Each recipe uses a 3×3 shaped crafting grid defined by:
#   shape      - Three strings, each 3 characters wide.
#                Each character maps to an ingredient key below.
#                A space ' ' means an empty slot.
#
#   Slot positions (characters in shape strings):
#     shape[0] = top row    → positions [col 0] [col 1] [col 2]
#     shape[1] = middle row → positions [col 0] [col 1] [col 2]
#     shape[2] = bottom row → positions [col 0] [col 1] [col 2]
#
#   ingredients - Maps each single character used in 'shape'
#                 to a Bukkit Material name.
#
# After editing this file, run /playergames reload in-game
# to apply changes without restarting the server.
# ═══════════════════════════════════════════════════════════

# ── Charge Bow ──────────────────────────────────────────────
# Shape:
#   PLAYER_HEAD  DRAGON_HEAD  PLAYER_HEAD
#   ELYTRA       BOW          ELYTRA
#   PLAYER_HEAD  DRAGON_HEAD  PLAYER_HEAD
chargebow:
  recipe:
    shape:
      - "ABA"
      - "CDC"
      - "EFE"
    ingredients:
      A: PLAYER_HEAD
      B: DRAGON_HEAD
      C: ELYTRA
      D: BOW
      E: PLAYER_HEAD
      F: DRAGON_HEAD

# ── Charged Mace ────────────────────────────────────────────
# Shape:
#   OMINOUS_TRIAL_KEY OMINOUS_TRIAL_KEY OMINOUS_TRIAL_KEY
#   EYE_OF_ENDER      HEAVY_CORE        OMINOUS_BANNER
#   BREEZE_ROD        BREEZE_ROD        BREEZE_ROD
charged_mace:
  recipe:
    shape:
      - "AAA"
      - "EHB"
      - "CCC"
    ingredients:
      A: OMINOUS_TRIAL_KEY
      E: EYE_OF_ENDER
      H: HEAVY_CORE
      B: OMINOUS_BANNER
      C: BREEZE_ROD

# ── Vampire Sword ────────────────────────────────────────────
# Shape:
#   NETHERRACK    PLAYER_HEAD   NETHER_WART
#   NETHERITE_INGOT DIAMOND_SWORD NETHERITE_INGOT
#   DIAMOND_BLOCK PLAYER_HEAD   DIAMOND_BLOCK
vampire_sword:
  recipe:
    shape:
      - "ABC"
      - "DED"
      - "FBF"
    ingredients:
      A: NETHERRACK
      B: PLAYER_HEAD
      C: NETHER_WART
      D: NETHERITE_INGOT
      E: DIAMOND_SWORD
      F: DIAMOND_BLOCK

# ── Stun Axe ─────────────────────────────────────────────────
# Shape:
#   SPECTRAL_ARROW  BOLT_ARMOR_TRIM_SMITHING_TEMPLATE  SPECTRAL_ARROW
#   TURTLE_SCUTE    DIAMOND_AXE                        TURTLE_SCUTE
#   EMERALD_ORE     EYE_ARMOR_TRIM_SMITHING_TEMPLATE   EMERALD_ORE
stun_axe:
  recipe:
    shape:
      - "ABC"
      - "DED"
      - "FGF"
    ingredients:
      A: SPECTRAL_ARROW
      B: BOLT_ARMOR_TRIM_SMITHING_TEMPLATE
      C: SPECTRAL_ARROW
      D: TURTLE_SCUTE
      E: DIAMOND_AXE
      F: EMERALD_ORE
      G: EYE_ARMOR_TRIM_SMITHING_TEMPLATE

# ── Thunder Trident ──────────────────────────────────────────
# Shape:
#   DIAMOND_BLOCK  PLAYER_HEAD  NETHER_STAR
#   NETHERITE_BLOCK TRIDENT     NETHERITE_BLOCK
#   NETHER_STAR    PLAYER_HEAD  NAUTILUS_SHELL
thunder_trident:
  recipe:
    shape:
      - "ABC"
      - "DED"
      - "FGH"
    ingredients:
      A: DIAMOND_BLOCK
      B: PLAYER_HEAD
      C: NETHER_STAR
      D: NETHERITE_BLOCK
      E: TRIDENT
      F: NETHER_STAR
      G: PLAYER_HEAD
      H: NAUTILUS_SHELL
